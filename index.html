<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#10151f" />
  <title>Castaway Mimics</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game" width="1280" height="720" aria-label="Castaway Mimics game canvas"></canvas>
  <div id="boot" class="boot">
    <div class="boot-card">
      <div class="boot-title">CASTAWAY MIMICS</div>
      <div class="boot-subtitle">top-down survival sandbox with monkey mimic automation</div>
      <div class="boot-note">Desktop: WASD/Arrows, Space/click, E, C, F, M. Mobile: drag left joystick, tap hotbar slots, use the right-side action buttons.</div>
      <div class="boot-actions">
        <button id="startBtn">Start / Resume</button>
        <button id="resumeBtn" type="button">Resume Save</button>
        <button id="newBtn" type="button">Fresh Island</button>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
