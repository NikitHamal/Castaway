<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Castaway Mimics</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game" width="1280" height="720" aria-label="Castaway Mimics game canvas"></canvas>
  <div id="boot" class="boot">
    <div class="boot-card">
      <div class="boot-title">CASTAWAY MIMICS</div>
      <div class="boot-subtitle">top-down survival sandbox prototype</div>
      <div class="boot-note">Click Start, then use WASD to move. Mouse-click aims tools; Space uses current facing. Press F1 for controls.</div>
      <button id="startBtn">Start</button>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
